<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Attendance Management System - Reset Password</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-intro">
        <p class="eyebrow">Account recovery</p>
        <h1>Choose a new password.</h1>
        <p>Your new password must contain at least eight characters.</p>
      </section>
      <section class="auth-card">
        <h2>Reset Password</h2>
        <div class="message" data-message role="alert" aria-live="polite"></div>
        <form data-reset-password-form>
          <div class="form-group"><label for="password">New password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required /></div>
          <div class="form-group"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required /></div>
          <button class="primary" type="submit">Reset Password</button>
        </form>
        <p><a href="pages/login.html">Back to Login</a></p>
      </section>
    </main>
    <script src="js/api.js"></script><script src="js/reset-password.js"></script>
  </body>
</html>
