  <body>
    <div class="shell"><aside class="sidebar"><p class="brand">Attendance /</p><nav><a href="employee-dashboard.html">Overview</a><a aria-current="page" href="attendance.html">Attendance</a><a href="leave.html">Leave</a><a href="profile.html">Profile</a></nav></aside><main class="content"><header class="topbar"><div><p class="eyebrow">Your records</p><h1>Attendance history</h1><p>Server-recorded time, in one clear view.</p></div><a class="button secondary" href="employee-dashboard.html">Back to overview</a></header><section class="card"><form class="form-grid" data-filter-form><div class="form-group"><label for="from">From</label><input id="from" name="from" type="date" /></div><div class="form-group"><label for="to">To</label><input id="to" name="to" type="date" /></div><div class="form-group"><label for="status">Status</label><select id="status" name="status"><option value="">All statuses</option><option>PRESENT</option><option>LATE</option><option>HALF_DAY</option><option>ON_LEAVE</option><option>ABSENT</option></select></div><div class="form-group"><label>&nbsp;</label><button class="primary" type="submit">Apply filters</button></div></form></section><section class="card"><div class="table-wrap"><table><thead><tr><th>Date</th><th>Check-in</th><th>Check-out</th><th>Duration</th><th>Late min</th><th>Status</th></tr></thead><tbody data-attendance-body></tbody></table></div><p class="state" data-state>Loading attendance...</p><div class="actions"><button class="secondary" data-prev type="button">Previous</button><span data-page>Page 1</span><button class="secondary" data-next type="button">Next</button></div></section></main></div>
