<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Admin Dashboard</title><link rel="stylesheet" href="../css/styles.css" /></head><body><div class="shell"><aside class="sidebar"><p class="brand">Attendance /</p><nav><a aria-current="page" href="admin-dashboard.html">Administration</a><a href="user-management.html">Users</a></nav></aside><main class="content"><header class="topbar"><div><p class="eyebrow">Administration</p><h1>System settings</h1><p>Define office timings used for late and overtime calculations.</p></div><button class="secondary" data-logout type="button">Sign out</button></header><section class="card"><form class="form-grid" data-settings-form><div class="form-group"><label for="officeStart">Office start (UTC)</label><input id="officeStart" name="officeStart" type="time" required /></div><div class="form-group"><label for="officeEnd">Office end (UTC)</label><input id="officeEnd" name="officeEnd" type="time" required /></div><div class="form-group"><label>Expected working minutes</label><output data-expected-working-minutes>Loading…</output></div><div class="form-group"><label>Assumed break minutes</label><output data-assumed-break-minutes>Loading…</output></div><div class="form-group"><label>Half-day threshold minutes</label><output data-half-day-threshold-minutes>Loading…</output></div><div class="form-group full"><button class="primary" type="submit">Save office timings</button></div></form><p class="state" data-state></p></section></main></div><script src="../js/api.js"></script><script src="../js/admin.js"></script></body></html>
