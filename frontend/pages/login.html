<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Attendance Management System - Login</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-intro">
        <p class="eyebrow">Workday, made visible</p>
        <h1>Back to the rhythm of work.</h1>
        <p>Sign in to record time, follow leave requests, and keep your attendance history close.</p>
      </section>
      <section class="auth-card">
        <p class="eyebrow">Employee attendance</p><h2>Welcome back</h2>
        <div class="message" data-message role="alert"></div>
        <form data-auth-form="login">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email" />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-field">
              <input type="password" id="password" name="password" placeholder="Enter password" required autocomplete="current-password" />
              <button class="password-toggle" data-password-toggle type="button" aria-label="Show password" aria-pressed="false">
                <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" /><circle cx="12" cy="12" r="2.75" /></svg>
              </button>
            </div>
          </div>
          <button class="primary" type="submit">Sign in</button>
        </form>
        <p><a href="../forgot-password.html">Forgot Password?</a></p>
        <p>New here? <a href="register.html">Create an employee account</a></p>
      </section>
    </main>
    <script src="../js/api.js"></script><script src="../js/auth.js"></script>
  </body>
</html>
