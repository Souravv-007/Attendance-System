<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Employees</title><link rel="stylesheet" href="../css/styles.css" /></head>
<body data-page="employees"><div class="shell"><aside class="sidebar"><p class="brand">Attendance /</p><nav><a href="hr-dashboard.html">Dashboard</a><a aria-current="page" href="employees.html">Employees</a><a href="attendance-management.html">Attendance</a><a href="leave-management.html">Leave</a><a href="reports.html">Reports</a></nav></aside><main class="content">
<header class="topbar"><div><p class="eyebrow">People</p><h1>Employees</h1></div><button class="secondary" data-refresh type="button">Refresh</button></header>
<section class="card"><form class="form-grid" data-filters><div class="form-group full"><label for="search">Search</label><input id="search" name="search" data-filter placeholder="Name, email, or employee ID" /></div><div class="form-group"><label for="department">Department</label><select id="department" name="department" data-filter><option value="">All departments</option></select></div><div class="form-group"><label for="role">Role</label><select id="role" name="role" data-filter><option value="">All roles</option><option>EMPLOYEE</option><option>HR</option><option>ADMIN</option></select></div><div class="form-group"><label for="isActive">Status</label><select id="isActive" name="isActive" data-filter><option value="">All statuses</option><option value="true">Active</option><option value="false">Inactive</option></select></div><div class="form-group"><label>&nbsp;</label><button class="primary" type="submit">Apply filters</button></div></form></section>
<section class="card"><h2>Create employee</h2><form class="form-grid" data-create-employee><div class="form-group"><label>Name</label><input name="name" required /></div><div class="form-group"><label>Employee ID</label><input name="employeeId" required /></div><div class="form-group"><label>Email</label><input name="email" type="email" required /></div><div class="form-group"><label>Password</label><input name="password" type="password" minlength="8" required /></div><div class="form-group"><label>Department</label><select name="department" data-department-options><option value="">Unassigned</option></select></div><div class="form-group"><label>Role</label><select name="role"><option>EMPLOYEE</option><option>HR</option></select></div><div class="form-group full"><button class="primary" type="submit">Create employee</button></div></form></section>
<section class="card"><div class="table-wrap"><table><thead><tr><th>Employee ID</th><th>Name</th><th>Email</th><th>Department</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead><tbody data-body></tbody></table></div><p class="state" data-state>Loading...</p><div class="pagination" data-pagination></div></section>
</main></div><script src="../js/api.js"></script><script src="../js/hr.js"></script></body></html>
