<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>HR Dashboard</title><link rel="stylesheet" href="../css/styles.css" /></head><body><div class="shell"><aside class="sidebar"><p class="brand">Attendance /</p><nav><a aria-current="page" href="hr-dashboard.html">Dashboard</a><a href="employees.html">Employees</a><a href="attendance-management.html">Attendance</a><a href="leave-management.html">Leave</a><a href="reports.html">Reports</a></nav></aside><main class="content"><header class="topbar"><div><p class="eyebrow">HR workspace</p><h1>Operational view</h1><p>Live attendance signals from the system.</p></div><div class="actions"><button class="secondary" data-refresh type="button">Refresh</button><button class="secondary" data-logout type="button">Sign out</button></div></header><div class="grid" data-dashboard><div class="card span-3"><p class="eyebrow">Employees</p><p class="metric" data-kpi="totalEmployees">—</p></div><div class="card span-3"><p class="eyebrow">Present</p><p class="metric" data-kpi="present">—</p></div><div class="card span-3"><p class="eyebrow">Late</p><p class="metric" data-kpi="late">—</p></div><div class="card span-3"><p class="eyebrow">Absent</p><p class="metric" data-kpi="absent">—</p></div><div class="card span-3"><p class="eyebrow">On leave</p><p class="metric" data-kpi="on_leave">—</p></div><div class="card span-3"><p class="eyebrow">Attendance rate</p><p class="metric" data-kpi="attendancePercentage">—</p></div><section class="card span-8"><h2>Attendance trend</h2><canvas id="attendanceChart" aria-label="Attendance trend chart"></canvas><p class="state" data-state>Loading...</p></section><section class="card span-4"><h2>By department</h2><div data-departments class="state">Loading...</div></section></div></main></div><script src="../js/api.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="../js/hr-dashboard.js"></script></body></html>
