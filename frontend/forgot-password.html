<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Attendance Management System - Forgot Password</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-intro">
        <p class="eyebrow">Account recovery</p>
        <h1>Reset your password.</h1>
        <p>Enter your registered email address and we'll help you reset your password.</p>
      </section>
      <section class="auth-card">
        <h2>Forgot Password?</h2>
        <div class="message" data-message role="alert" aria-live="polite"></div>
        <form data-forgot-password-form>
          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
          </div>
          <button class="primary" type="submit">Send Reset Link</button>
        </form>
        <p><a href="pages/login.html">Back to Login</a></p>
      </section>
    </main>
    <script src="js/api.js"></script><script src="js/forgot-password.js"></script>
  </body>
</html>
